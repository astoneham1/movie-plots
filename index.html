<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Badly Explained Movies</title>
    <link rel="icon" type="image/x-icon" href="resources/favicon.ico">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Notable&family=Overpass+Mono&display=swap" rel="stylesheet">
    <script src="index.js"></script>
</head>
<body>
    <div class="film-strip left"></div>
    <div class="film-strip right"></div>
    <div id="title">
        <h1>Guess the Movie</h1>
        <h3>from a badly explained plot</h3>
        <p id="score" style="font-size: 1rem; color: #333"><strong>Score:</strong> 0</p>
        <p id="high-score" style="font-size: 1rem; color: #333"><strong>High Score: </strong>0</p>
    </div>
    <div class="row">
        <h2 id="plot-text">A really badly explained movie plot</h2>
    </div>
    <div id="hint-container" class="row">
        <h3 id="hintText"><i>A really bad hint</i></h3>
    </div>
    <div class="row">
        <div class="search-wrapper">
            <div class="search-input-container">
                <input type="text" id="movie-search" placeholder="Type a movie name..." autocomplete="off">
                <div id="search-results" class="results-list"></div>
            </div>
            <div class="search-buttons-mobile">
                <button id="hint">Hint</button>
                <button id="skip">Skip</button>
            </div>
        </div>
    </div>
    <div id="answer-container" class="row"></div>
</body>
</html>
